<style>
/* Layout: app shell for one-handed use. Compact sticky header, headliner carousel, artwork-led set cards, mini player + tab bar pinned to the bottom. */
:root {
  --bg: #F4F2F8; --surface: #FFFFFF; --surface-2: #ECE9F3; --fg: #17132A; --muted: #625C78; --line: #DEDAE8;
  --accent: #A8480A; --accent-soft: #FBE9DA; --accent-ink: #FFFFFF; --heart: #D92D4B; --warn: #B4231F; --warn-bg: #FDECEA;
  --st-mainstage: #C27A06; --st-freedom: #D83B47; --st-crystal: #1C93A8; --st-codex: #7553E0; --st-core: #3A8F4B; --st-papillon: #D3306F; --st-moose: #8B6A5C;
  --font-display: "Unbounded", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px; --tab-h: 78px; --player-h: 0px;
  --shadow: 0 1px 2px rgb(20 10 40 / .06), 0 6px 20px rgb(20 10 40 / .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D0B14; --surface: #17141F; --surface-2: #221E2E; --fg: #F3F0F9; --muted: #A49DBA; --line: #2B2639;
  --accent: #FFB13B; --accent-soft: #33240F; --accent-ink: #1A1200; --heart: #FF5C72; --warn: #FF8A80; --warn-bg: #3A1618;
  --st-mainstage: #FFB13B; --st-freedom: #FF6370; --st-crystal: #4CC9DE; --st-codex: #9D83FF; --st-core: #5BC26E; --st-papillon: #FF5F9E; --st-moose: #C49A86;
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D0B14; --surface: #17141F; --surface-2: #221E2E; --fg: #F3F0F9; --muted: #A49DBA; --line: #2B2639;
  --accent: #FFB13B; --accent-soft: #33240F; --accent-ink: #1A1200; --heart: #FF5C72; --warn: #FF8A80; --warn-bg: #3A1618;
  --st-mainstage: #FFB13B; --st-freedom: #FF6370; --st-crystal: #4CC9DE; --st-codex: #9D83FF; --st-core: #5BC26E; --st-papillon: #FF5F9E; --st-moose: #C49A86;
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.tnum { font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; }
.sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.5) blur(16px); -webkit-backdrop-filter: saturate(1.5) blur(16px); }
.top-inner { display: flex; flex-direction: column; gap: 10px; padding-block: 10px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.05; margin: 3px 0 0; letter-spacing: -.02em; text-wrap: balance; }
.hdr-actions { display: flex; gap: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; flex: none; position: relative; text-decoration: none; }
.icon-btn svg { width: 20px; height: 20px; }

.days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.days button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; gap: 2px; }
.days b { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.days span { font-size: 11.5px; color: var(--muted); }
.days button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.days button[aria-selected="true"] span { color: color-mix(in srgb, var(--bg) 75%, var(--fg)); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c, var(--accent)) 18%, var(--surface)); border-color: var(--c, var(--accent)); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.seg { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: 12px; gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 36px; padding: 0 14px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button svg { width: 16px; height: 16px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; font-size: 13px; font-weight: 600; color: var(--muted); border: 0; background: none; padding: 0 2px; }
.toggle .sw { width: 40px; height: 24px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgb(0 0 0 / .3); }
.toggle[aria-pressed="true"] { color: var(--fg); }
.toggle[aria-pressed="true"] .sw { background: var(--heart); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(16px); }

main { padding-block: 6px calc(var(--tab-h) + var(--player-h) + env(safe-area-inset-bottom, 0px) + 28px); }
.section-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin: 18px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.section-title small { font-family: var(--font-body); font-size: 12.5px; font-weight: 500; color: var(--muted); }

/* Artwork */
.art { position: relative; overflow: hidden; border-radius: 14px; background: var(--g); display: grid; place-items: center; color: #fff; flex: none; isolation: isolate; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.art .ini { font-family: var(--font-display); font-weight: 800; letter-spacing: -.03em; text-shadow: 0 2px 12px rgb(0 0 0 / .35); z-index: 0; }
.art.has-img .ini { display: none; }
.play { position: absolute; z-index: 2; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .94); color: #120E1E; box-shadow: 0 4px 14px rgb(0 0 0 / .35); transition: transform .15s; }
.play svg { width: 45%; height: 45%; margin-left: 8%; }
.play.is-playing svg { margin-left: 0; }
.play:active { transform: scale(.9); }

/* Headliner carousel */
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 2px max(16px, env(safe-area-inset-left, 0px)) 6px; }
.rail::-webkit-scrollbar { display: none; }
.poster { flex: none; width: min(68vw, 250px); scroll-snap-align: start; border-radius: 22px; overflow: hidden; position: relative; aspect-ratio: 4 / 5; max-width: 100%; box-shadow: var(--shadow); }
.poster .art { position: absolute; inset: 0; border-radius: 0; }
.poster .art .ini { font-size: 54px; transform: translateY(-30px); }
.poster .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0) 35%, rgb(0 0 0 / .82)); z-index: 1; pointer-events: none; }
.poster .info { position: absolute; z-index: 2; left: 14px; right: 14px; bottom: 14px; color: #fff; display: flex; flex-direction: column; gap: 3px; }
.poster .info button { all: unset; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.1; overflow-wrap: anywhere; }
.poster .info button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.poster .info small { font-size: 12.5px; opacity: .85; display: flex; align-items: center; gap: 6px; }
.poster .play { width: 52px; height: 52px; right: 12px; top: 12px; }
.poster .fav { position: absolute; z-index: 2; left: 10px; top: 10px; background: rgb(0 0 0 / .35); color: #fff; backdrop-filter: blur(6px); }

/* Set cards */
.hour { display: grid; grid-template-columns: 1fr; }
.hour-label { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 180px)); z-index: 5; justify-self: start; font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 5px 11px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin: 14px 0 8px; }
.rows { display: grid; grid-template-columns: 1fr; gap: 10px; min-width: 0; }
.set { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 14px; padding: 10px 4px 10px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.set .art { width: 76px; height: 76px; }
.set .art .ini { font-size: 22px; }
.set .play { width: 34px; height: 34px; right: 6px; bottom: 6px; }
.set-main { min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.set-name { font-weight: 700; font-size: 16.5px; line-height: 1.2; overflow-wrap: anywhere; }
.set-name .b2b { font-weight: 500; color: var(--muted); font-size: 13px; }
.time { font-size: 13.5px; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 99px; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--fg); width: fit-content; }
.genre { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav { width: 48px; height: 48px; border-radius: 14px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); }
.fav svg { width: 24px; height: 24px; transition: transform .18s cubic-bezier(.3,1.6,.5,1); }
.fav[aria-pressed="true"] { color: var(--heart); }
.fav[aria-pressed="true"] svg { fill: currentColor; transform: scale(1.08); }
.fav:active svg { transform: scale(.8); }
.set.is-fav { border-color: color-mix(in srgb, var(--heart) 45%, var(--line)); }

/* Timetable grid */
.grid-scroll { overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); position: relative; margin-top: 4px; }
.grid { display: grid; grid-template-columns: 58px repeat(var(--cols), minmax(158px, 1fr)); min-width: min-content; position: relative; }
.g-head { position: relative; z-index: 8; will-change: transform; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 6px; align-items: center; min-height: 46px; }
.g-head.corner { position: sticky; left: 0; z-index: 9; }
.grid-scroll .g-head { transform: translateY(var(--hy, 0px)); box-shadow: 0 -24px 0 var(--surface); }
.g-times { position: sticky; left: 0; z-index: 7; background: var(--surface); border-right: 1px solid var(--line); }
.g-times span { position: absolute; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); transform: translateY(-50%); }
.g-col { position: relative; border-right: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(var(--ppm) * 60px)); background-position: 0 8px; }
.g-set { position: absolute; left: 4px; right: 4px; border-radius: 12px; overflow: hidden; color: #fff; }
.g-set .art { position: absolute; inset: 0; border-radius: 0; }
.g-set .art .ini { font-size: 30px; opacity: .35; }
.g-set .shade { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgb(0 0 0 / .55), rgb(0 0 0 / .2) 60%, rgb(0 0 0 / .45)); pointer-events: none; }
.g-set .g-open { all: unset; cursor: pointer; position: absolute; inset: 0; z-index: 2; padding: 7px 40px 7px 9px; display: flex; flex-direction: column; gap: 1px; }
.g-set .g-open:focus-visible { outline: 2px solid #fff; outline-offset: -3px; border-radius: 12px; }
.g-set b { font-size: 13.5px; line-height: 1.15; overflow-wrap: anywhere; text-shadow: 0 1px 6px rgb(0 0 0 / .5); }
.g-set small { font-size: 11.5px; opacity: .9; }
.g-set .fav { position: absolute; z-index: 3; right: 0; top: 0; width: 40px; height: 40px; color: #fff; }
.g-set .play { width: 30px; height: 30px; right: 6px; bottom: 6px; z-index: 3; }
.g-set.short .play { display: none; }
.g-set.is-fav { box-shadow: inset 0 0 0 2px var(--heart); }

/* Now */
.banner { padding: 20px; border-radius: 22px; background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 60%), var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.banner .big { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; }
.banner p { margin: 0; color: var(--muted); }
.preview-note { margin: 12px 2px 0; font-size: 13px; font-weight: 700; color: var(--accent); }
.preview-row { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.preview-row label { font-size: 13px; font-weight: 600; color: var(--muted); width: 100%; }
.preview-row select { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 12px; font-weight: 600; }
.btn { min-height: 46px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.now-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
.now-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.now-card h3 { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
.now-act { display: grid; grid-template-columns: 84px 1fr auto; gap: 14px; align-items: center; }
.now-act .art { width: 84px; height: 84px; }
.now-act .art .ini { font-size: 24px; }
.now-act .play { width: 36px; height: 36px; right: 6px; bottom: 6px; }
.now-act .set-name { font-size: 19px; }
.bar { height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 9px; }
.bar-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.next { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0 0; border: 0; border-top: 1px dashed var(--line); font-size: 14px; background: none; width: 100%; text-align: left; min-height: 44px; }
.next em { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin-right: 6px; }
.idle { color: var(--muted); font-size: 14px; }

/* Timeline */
.tl-item { display: grid; grid-template-columns: 62px 1fr; gap: 10px; }
.tl-time { font-size: 13px; font-weight: 700; padding-top: 14px; text-align: right; line-height: 1.25; }
.tl-time small { display: block; color: var(--muted); font-weight: 500; }
.tl-item + .tl-item, .gap + .tl-item { margin-top: 10px; }
.gap { margin: 10px 0 0 72px; padding: 6px 0 6px 12px; font-size: 12.5px; color: var(--muted); border-left: 2px dotted var(--line); }
.clash { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--warn); background: var(--warn-bg); padding: 2px 9px; border-radius: 99px; width: fit-content; }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty .heart-big { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--heart) 14%, var(--surface)); color: var(--heart); }
.empty strong { color: var(--fg); font-size: 17px; }
.day-summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }

/* Explore */
.search { position: relative; margin-top: 6px; }
.search input { width: 100%; min-height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px 0 46px; font-size: 16px; box-shadow: var(--shadow); }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); }
.count { font-size: 13px; color: var(--muted); margin: 14px 0 8px; }
.artists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.acard { position: relative; border-radius: var(--r); overflow: hidden; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: var(--shadow); min-width: 0; }
.acard .art { aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: 0; }
.acard .art .ini { font-size: 34px; }
.acard .play { width: 40px; height: 40px; right: 8px; bottom: 8px; }
.acard .open { all: unset; cursor: pointer; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.acard .open:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.acard .set-name { font-size: 15px; }
.acard .days-mini { display: flex; gap: 4px; flex-wrap: wrap; }
.acard .days-mini span { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.acard .fav { position: absolute; top: 6px; right: 6px; z-index: 3; color: #fff; background: rgb(0 0 0 / .3); width: 42px; height: 42px; border-radius: 50%; backdrop-filter: blur(6px); }
.acard .fav[aria-pressed="true"] { color: #fff; background: var(--heart); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgb(8 6 14 / .55); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgb(0 0 0 / .3); }
.sheet.open { transform: none; }
.sheet-hero { position: relative; height: 260px; }
.sheet-hero .art { position: absolute; inset: 0; border-radius: 0; }
.sheet-hero .art .ini { font-size: 72px; transform: translateY(-20px); }
.sheet-hero .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / .25), rgb(0 0 0 / 0) 30%, rgb(0 0 0 / .8)); z-index: 1; }
.sheet-hero .grab { position: absolute; z-index: 2; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 5px; border-radius: 9px; background: rgb(255 255 255 / .6); }

.sheet-hero .play { width: 60px; height: 60px; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 16px; background: var(--accent); color: var(--accent-ink); }
.sheet-body { padding: 4px max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px)); }
.sheet h4 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
.fav-all { margin-top: 16px; width: 100%; }
.fav-all[aria-pressed="true"] { background: color-mix(in srgb, var(--heart) 14%, var(--surface)); border-color: var(--heart); color: var(--heart); }
.fav-all svg { width: 20px; height: 20px; }

.links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.links a { min-height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); text-decoration: none; font-weight: 600; font-size: 14px; }

.sheet-sets { display: flex; flex-direction: column; gap: 10px; }


/* Tab bar */
/* Floating dock with a sliding highlight */
nav.tabs { position: fixed; z-index: 25; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))); }
.tabs-inner { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 28px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(22px) saturate(1.7); -webkit-backdrop-filter: blur(22px) saturate(1.7);
  border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
  box-shadow: 0 12px 32px rgb(0 0 0 / .22), 0 2px 6px rgb(0 0 0 / .08), inset 0 1px 0 rgb(255 255 255 / .07); }
.tabs-inner::before { content: ""; position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 5); border-radius: 22px;
  background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .42s cubic-bezier(.34, 1.4, .5, 1); }

/* Social: crowd avatars, busy slots, account */
.crowd { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.crowd .av { margin-left: -7px; }
.crowd .av:first-child { margin-left: 0; }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 800; color: #120E1E; background: var(--c, var(--accent)); box-shadow: 0 0 0 2px var(--surface); flex: none; letter-spacing: -.02em; }
.av.lg { width: 34px; height: 34px; font-size: 12.5px; }
.g-set .crowd, .poster .crowd { color: #fff; }
.g-set .crowd .av, .poster .crowd .av { box-shadow: 0 0 0 2px rgb(0 0 0 / .5); }
.busy { position: absolute; left: 0; right: 0; z-index: 4; pointer-events: none;
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--heart) 30%, transparent) 0 6px, transparent 6px 13px);
  border-top: 2px solid color-mix(in srgb, var(--heart) 70%, transparent); border-bottom: 2px solid color-mix(in srgb, var(--heart) 70%, transparent); }
.g-set.blocked { filter: grayscale(.85) brightness(.6); }
.g-set.is-fav { z-index: 5; box-shadow: 0 0 0 3px var(--heart), 0 8px 24px rgb(0 0 0 / .45); }
.set.blocked { opacity: .55; }
.busy-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--heart); background: color-mix(in srgb, var(--heart) 12%, transparent); padding: 2px 8px; border-radius: 99px; width: fit-content;
  background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--heart) 16%, transparent) 0 4px, transparent 4px 8px); }
.acct { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13.5px; }
@media (max-width: 420px) { .acct .nm { display: none; } .acct { padding: 0 6px; } .eyebrow { font-size: 10px; letter-spacing: .1em; } }
.acct.signin { padding: 0 14px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.auth { padding: 22px max(18px, env(safe-area-inset-right, 0px)) 8px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.auth h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.auth p { margin: 0; color: var(--muted); }
.auth label { font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
.auth .err { color: var(--warn); font-size: 13.5px; font-weight: 600; min-height: 1em; }
.gbtn { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: #1f1f1f; font-weight: 700; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
.gbtn svg { width: 18px; height: 18px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 600; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.auth .hint { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.auth .switch { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 8px 0; text-align: left; }
.going { display: flex; flex-wrap: wrap; gap: 8px; }
.going > span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px 3px 3px; border-radius: 99px; background: var(--surface-2); }
.going .av { box-shadow: none; }
.swap { display: flex; flex-direction: column; gap: 10px; }
/* Personal blocks: dining sessions and breaks */
.busy.plan { border-style: dashed; }
.busy.plan span { position: absolute; left: 6px; top: 4px; font-size: 11px; font-weight: 800; color: var(--heart); background: var(--surface); padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.plan-ico { width: 76px; height: 76px; border-radius: 14px; display: grid; place-items: center; font-size: 30px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--heart) 18%, var(--surface-2)) 0 6px, var(--surface-2) 6px 13px); }
.set.plan-row .set-main { cursor: default; }
.plan-tools { display: flex; justify-content: flex-end; margin: 4px 0 12px; }
.plan-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.plan-seg button { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 13px; padding: 4px 6px; }

.toolbar .add-block { min-height: 42px; padding: 0 12px; font-size: 13px; white-space: nowrap; }

.times { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 12px; }
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.online.off::before { background: var(--muted); }
.msgs { display: flex; flex-direction: column; gap: 6px; min-height: 240px; padding-bottom: 8px; }
.msg { display: flex; flex-direction: column; gap: 2px; max-width: 82%; align-self: flex-start; }

.msg .bubble { background: var(--surface); border: 1px solid var(--line); padding: 8px 12px; border-radius: 18px 18px 18px 6px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }

.day-sep { align-self: center; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 6px 0; }
.composer { position: sticky; bottom: calc(var(--tab-h) + var(--player-h) + env(safe-area-inset-bottom, 0px) + 8px); display: grid; grid-template-columns: 1fr 48px; gap: 8px; padding: 8px; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); z-index: 6; }
.composer textarea { resize: none; border: 0; background: transparent; padding: 11px 10px; min-height: 46px; max-height: 120px; font: inherit; font-size: 16px; color: var(--fg); outline: none; }
.composer button { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; align-self: end; }
.composer button:disabled { opacity: .4; }
.composer button svg { width: 20px; height: 20px; }
/* Chat inbox + conversation (WhatsApp-style) */
.chat-split { display: grid; gap: 16px; }
.inbox { display: flex; flex-direction: column; }
.inbox-search { margin: 0 0 6px; }
.room-sec { font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 16px 8px 6px; }
.room-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 18px; text-decoration: none; color: inherit; transition: background .15s; -webkit-tap-highlight-color: transparent; }
.room-row:active { background: var(--surface-2); }
@media (hover: hover) { .room-row:hover { background: var(--surface); } }
.room-row.on { background: var(--accent-soft); }
.room-ico { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 25px; background: color-mix(in srgb, var(--c, var(--accent)) 22%, var(--surface-2)); overflow: hidden; }
.room-ico.sm { width: 40px; height: 40px; font-size: 20px; }
.room-ico .art { width: 100%; height: 100%; border-radius: 0; }
.room-ico .art .ini { font-size: 17px; }
.room-ico.sm .art .ini { font-size: 13px; }
.rr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rr-top, .rr-bot { display: flex; align-items: center; gap: 8px; }
.rr-top b { flex: 1; min-width: 0; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-time { font-size: 12px; color: var(--muted); flex: none; }
.rr-time.new { color: var(--accent); font-weight: 700; }
.rr-prev { flex: 1; min-width: 0; color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-badge { flex: none; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.rr-live { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--st-core); }
.crew-box { margin-top: 14px; }
.convo { display: none; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; min-height: 0; }
.chat-split.has-room .inbox { display: none; }
.chat-split.has-room .convo { display: flex; }
.convo-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.convo-head .back { border: 0; background: transparent; width: 40px; margin-left: -4px; }
.convo-head .back svg { width: 24px; height: 24px; }
.ch-title { all: unset; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; cursor: pointer; }
.ch-title b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-title .online { font-size: 12px; }
.convo .msgs { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 12px 8px; background: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--fg) 6%, transparent) 1px, transparent 0) 0 0 / 18px 18px, var(--bg); }
.convo .composer { position: static; margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; padding: 8px 10px; }
.convo .composer textarea { background: var(--surface-2); border-radius: 22px; padding: 11px 16px; }
.leave-btn { border: 0; background: transparent; color: var(--muted); }
.leave-btn svg { width: 22px; height: 22px; }
.msg .bubble[data-msg] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.msg .bubble[data-msg]:active { filter: brightness(.94); }
.banned-note { margin: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); text-align: center; }
.quote { margin: 0; padding: 10px 14px; border-left: 4px solid var(--heart); background: var(--surface-2); border-radius: 0 12px 12px 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.btn.danger { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; align-self: flex-start; }
.chip.reason { cursor: pointer; position: relative; }
.chip.reason input { position: absolute; opacity: 0; pointer-events: none; }
.chip.reason:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.left-rooms summary { cursor: pointer; list-style: none; }

.admin-link { text-decoration: none; color: inherit; }
.admin .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }

.admin .stats span { font-size: 12px; color: var(--muted); }
.adm-head { display: flex; gap: 12px; align-items: center; }

.adm-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); }
.tag.hot { background: var(--accent-soft); }
.tag.ban { background: var(--warn-bg); color: var(--warn); }
.adm-rep { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.adm-rep.done { opacity: .6; }
.adm-rep .note { margin: 0; }
.person summary { list-style: none; cursor: pointer; }
.person summary::-webkit-details-marker { display: none; }
.person[open] summary { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.pdl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }

.pdl dd { margin: 0; }
.person.is-banned, .adm-user.is-banned { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.convo-empty { flex: 1; display: grid; place-items: center; color: var(--muted); padding: 40px; text-align: center; }
body.in-convo { --tab-h: 0px; }

@media (min-width: 900px) {
  .chat-split { grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
  .chat-split .inbox { display: flex !important; position: sticky; top: calc(var(--hdr) + 12px); max-height: calc(100dvh - var(--hdr) - var(--tab-h) - var(--player-h) - 40px); overflow-y: auto; padding-right: 4px; }
  .chat-split .convo { display: flex; position: sticky; top: calc(var(--hdr) + 12px); height: calc(100dvh - var(--hdr) - var(--tab-h) - var(--player-h) - 40px); }
  .convo-head .back { display: none; }
}
.msg { flex-direction: row; align-items: flex-end; gap: 8px; }
.msg .who { width: 28px; flex: none; }

/* Avatars: initials, emoji or photo */

.av.xl { width: 96px; height: 96px; font-size: 34px; box-shadow: 0 0 0 4px var(--surface), 0 8px 24px rgb(0 0 0 / .25); }

/* Profile */
.profile { display: flex; flex-direction: column; gap: 14px; max-width: 640px; }
.prof-hero { flex-direction: row; align-items: center; gap: 18px; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c) 28%, transparent), transparent 60%), var(--surface); }
.prof-hero h2 { margin: 0; font-family: var(--font-display); font-size: 24px; }

.prof-av { position: relative; flex: none; }
.prof-cam { position: absolute; right: -4px; bottom: -4px; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 0 3px var(--surface); }

.av-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 10px; }
.av-opt { all: unset; box-sizing: border-box; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-size: 24px; background: color-mix(in srgb, var(--c) 24%, var(--surface-2)); border: 2px solid transparent; transition: transform .15s; overflow: hidden; }
.av-opt:active { transform: scale(.9); }
.av-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.av-opt .av { width: 100%; height: 100%; box-shadow: none; font-size: 17px; }
.av-opt.up { font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); flex-direction: column; gap: 0; }

.sw-row { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { all: unset; width: 34px; height: 34px; border-radius: 50%; background: var(--c); cursor: pointer; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats a { text-decoration: none; color: inherit; background: var(--surface-2); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stats b { font-family: var(--font-display); font-size: 22px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }

.toast { font-family: var(--font-hand); border: 2px solid var(--ink); }
.bar { border: 1.5px solid var(--ink); background: transparent; height: 10px; }
.bar i { background: repeating-linear-gradient(-45deg, var(--c) 0 4px, transparent 4px 7px); }
.av { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
:focus-visible { outline: 2.5px dashed var(--accent); }

/* Generated artwork (no photo): flat marker colour with pencil hatching instead of random gradients */
.art:not(.has-img) { background: repeating-linear-gradient(-35deg, rgb(0 0 0 / .14) 0 2px, transparent 2px 7px), var(--mk, var(--pink)) !important; }
.set:nth-child(4n+1) .art, .acard:nth-child(4n+1) .art, .poster:nth-child(4n+1) .art { --mk: var(--sky); }
.set:nth-child(4n+2) .art, .acard:nth-child(4n+2) .art, .poster:nth-child(4n+2) .art { --mk: var(--mint); }
.set:nth-child(4n+3) .art, .acard:nth-child(4n+3) .art, .poster:nth-child(4n+3) .art { --mk: var(--hi); }
.art .ini { font-family: var(--font-display); color: var(--hi-text); text-shadow: none; font-weight: 700; }
.poster .art .ini { color: var(--hi-text); }

/* Hero (line-up page): the sketched 3D crystal is anchored here */
.hero3d { display: none; position: relative; min-height: clamp(250px, 40vh, 380px); margin: 0 0 6px; padding: 18px 0 14px; align-items: flex-end; pointer-events: none; }
main:has(#v-lineup:not([hidden])) .hero3d { display: flex; }
.hero3d .ht { position: relative; z-index: 1; max-width: 64%; display: flex; flex-direction: column; gap: 10px; }
.hero3d::before { content: ""; position: absolute; z-index: 0; right: -10%; top: -6%; width: 78%; aspect-ratio: 1; border-radius: 50%;
  background: repeating-conic-gradient(from 6deg, color-mix(in srgb, var(--hi) 30%, transparent) 0 4deg, transparent 4deg 22.5deg);
  -webkit-mask: radial-gradient(closest-side, #000 25%, transparent 100%); mask: radial-gradient(closest-side, #000 25%, transparent 100%); opacity: .7; }
.hero3d .kick { font-family: var(--font-hand); font-size: 16px; color: var(--muted); transform: rotate(-2deg); width: fit-content; }
.hero3d .ht > * { text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); }
.hero3d b { font-family: var(--font-display); font-weight: 700; font-size: clamp(50px, 15vw, 96px); line-height: .9; }
/* Highlighter swipe sits on its own line box, so it never touches the line above or the stats below */
.hero3d b em { font-style: normal; display: inline-block; margin-top: .06em; padding: .02em .14em .06em; line-height: 1; background: var(--grad);
  border-radius: 6px 14px 5px 12px / 12px 5px 14px 6px; transform: rotate(-1.5deg); text-shadow: none; }
.hero3d .sub { font-family: var(--font-hand); font-size: 17px; line-height: 1.6; color: var(--muted); }
/* Numbers get a small clay tag (padding is horizontal only, so nothing spills over the text) instead of an underline that cut through the digits */
.hero3d .sub i { font-style: normal; font-family: var(--font-display); font-size: 1.25em; font-weight: 700; line-height: 1; color: var(--hi-text);
  background: var(--pink); padding: 0 .28em; border-radius: 8px 3px 7px 4px / 4px 7px 3px 8px; text-shadow: none; }
.hero3d .arrow { position: absolute; right: -30%; top: -36px; transform: rotate(48deg); width: 92px; height: 60px; color: var(--ink); }
.hero3d .arrow path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw 1.2s .6s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
:root.reveal .hero3d .ht > * { animation: heroin .8s cubic-bezier(.2, .9, .25, 1.1) both; }
:root.reveal .hero3d .ht > :nth-child(2) { animation-delay: .08s; } :root.reveal .hero3d .ht > :nth-child(3) { animation-delay: .16s; }
@keyframes heroin { from { opacity: 0; transform: translateY(18px) rotate(-3deg); } }
@media (min-width: 720px) { .hero3d .ht { max-width: 55%; } }
@media (prefers-reduced-motion: reduce) { .hero3d .arrow path { animation: none; stroke-dashoffset: 0; } }

/* Headliner coverflow (3D tilt by rail position) */
.rail { perspective: 1000px; perspective-origin: 50% 40%; padding-bottom: 12px; }
.poster { transform: rotateY(var(--ry, 0deg)) scale(var(--sc, 1)); will-change: transform; }

/* Cards drop into place like stickers the first time they scroll into view */
:root.reveal .now-card:not(.in), :root.reveal .acard:not(.in), :root.reveal .tl-item:not(.in) { opacity: 0; transform: translateY(14px); }
:root.reveal .in { transition: opacity .3s ease-out, transform .35s cubic-bezier(.2, .8, .3, 1); }
@media (hover: hover) { .set:active, .acard:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); transition: transform .08s, box-shadow .08s; } }

/* Support (Ko-fi) */
.support { text-decoration: none; position: relative; margin: 30px auto 0; max-width: 560px; padding: 18px 20px; text-align: left; color: var(--fg);
  display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: center; background: var(--surface);
  border: 2px solid var(--ink); border-radius: var(--wob); box-shadow: 5px 6px 0 var(--ink); transform: rotate(-.8deg); }
.support::before { content: ""; position: absolute; top: -12px; left: 50%; width: 90px; height: 24px; margin-left: -45px; background: color-mix(in srgb, var(--hi) 75%, transparent); transform: rotate(-3deg); border-left: 2px dashed rgb(0 0 0 / .12); border-right: 2px dashed rgb(0 0 0 / .12); }
.support .cup { width: 58px; height: 58px; border-radius: var(--wob2); display: grid; place-items: center; background: var(--pink); color: var(--ink); border: 2px solid var(--ink); }
.support .cup svg { width: 32px; height: 32px; }
.support .cup .steam { animation: steam 2.6s ease-in-out infinite; }
.support .cup .steam:nth-child(2) { animation-delay: -1.3s; }
@keyframes steam { 0%,100% { opacity: .25; transform: translateY(1px); } 50% { opacity: 1; transform: translateY(-1.5px); } }
.support .t { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; }
.support .d { display: block; margin-top: 4px; font-family: var(--font-hand); font-size: 15.5px; color: var(--muted); }
.support .btn { grid-column: 1 / -1; background: var(--hi); color: var(--hi-text); border: 2px solid var(--ink); box-shadow: var(--pop); min-height: 48px; font-family: var(--font-display); font-size: 24px; font-weight: 700; }
@media (min-width: 520px) { .support { grid-template-columns: 58px 1fr auto; } .support .btn { grid-column: auto; padding: 0 22px; } }
@media (prefers-reduced-motion: reduce) { .support .cup .steam { animation: none; } }
footer.foot { font-family: var(--font-hand); font-size: 15px; }

/* Dark mode: solid marker fills with dark ink text, so pressed chips and highlights stay readable */
:root[data-theme="dark"] .chip[aria-pressed="true"] { background: var(--c, var(--hi)); color: var(--hi-text); }
:root[data-theme="dark"] .chip[aria-pressed="true"] .dot { background: var(--hi-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { background: var(--c, var(--hi)); color: var(--hi-text); }
  :root:not([data-theme="light"]) .chip[aria-pressed="true"] .dot { background: var(--hi-text); } }
.hero3d b em { color: var(--hi-ink, inherit); }
</style>

const slugify = n => n.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/&/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

{

    if (line.startsWith("#")) { day = line.slice(1); continue; }

    const [who, s, e, g] = line.split(";");
    const artists = who.split("|").map(p => { const [name, sl] = p.split("~"); return { name, slug: sl || slugify(name) }; });
    const genres = g ? g.split(",").map(x => x.trim()).filter(Boolean) : [];
    const set = { key: day + "/" + artists.map(a=>a.slug).join("+"), day, stage, artists, start: toMin(s), end: toMin(e), genres };
    SETS.push(set);
    for (const a of artists) {
      if (!ARTISTS.has(a.slug)) ARTISTS.set(a.slug, { slug: a.slug, name: a.name, sets: [], solo: new Set(), any: new Set() });
      const A = ARTISTS.get(a.slug);
      A.sets.push(set);
      genres.forEach(x => (artists.length === 1 ? A.solo : A.any).add(x));

  }

}

const planClashes = set => state.plans.filter(p => overlaps(p, set));

const blockName = b => b.artists ? nameText(b) : b.label;
async function persistFavs(add, remove) {

  updateBadge(); afterFavChange();

    catch (e) { add.forEach(k => state.favs.delete(k)); remove.forEach(k => state.favs.add(k)); updateBadge(); afterFavChange(); toast(e.status === 401 ? "Log in again to save sets" : "Couldn't save. Check your connection."); }

}
function toggleFav(key) {

  if (state.favs.has(key)) { persistFavs([], [key]); toast("Removed from your timeline"); return; }

}

// ---------- Your own blocks: dining sessions and breaks ----------

    ["2026-12-12", "14:00", "15:20"], ["2026-12-12", "19:15", "20:35"], ["2026-12-12", "20:55", "22:15"],
    ["2026-12-13", "14:00", "15:20"], ["2026-12-13", "15:55", "17:15"], ["2026-12-13", "17:35", "18:55"], ["2026-12-13", "19:15", "20:35"], ["2026-12-13", "20:55", "22:15"]

const fromField = v => { const m = /^(\d{2}):(\d{2})$/.exec(v || ""); if (!m) return null; let h = +m[1]; if (h < 10) h += 24; return h * 60 + +m[2]; };

function planFormValues() {

}

        const img = li.querySelector("img")?.getAttribute("src");
        if (img && slugs.length) for (const sl of slugs) if (slugs.length === 1 || !IMG[sl]) IMG[sl] = new URL(img, SOURCE + "/").href;
        for (const b of li.querySelectorAll("button[data-players]")) {
          const id = b.dataset.artistId || slugs[0];
          try { const list = JSON.parse(b.dataset.players).map(x => ({ service: x.service, src: x.player?.src, autoplaySrc: x.player?.autoplaySrc })); if (id && !PLAYERS[id]) PLAYERS[id] = list; } catch {}
        }
      }
    }
    PLAYERS_LOADED = true;
    warmPhotos();
    // Solo-set photos win; artists only seen in b2b sets keep the shared photo.

    navigator.serviceWorker.ready.then(() => { if (PLAYERS_LOADED) warmPhotos(); });
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (PLAYERS_LOADED) warmPhotos(); });
    // Home-screen apps are granted persistent storage on iOS and Android; in a browser tab this may be declined quietly.
    if (isStandalone()) askPersist(); else navigator.storage?.persisted?.().then(v => { state.persisted = v; }).catch(() => {});

}
function offlineCardHTML() {
  const at = store.get("syncedAt", 0);
  const when = at ? new Date(at).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit", hour12: true }) : "";
  const n = state.favs.size;
  const how = isStandalone() ? "" : isIOS()
    ? `<p class="note" style="margin-top:10px">To use it offline, open this site in Safari, tap <b>Share</b>, then <b>Add to Home Screen</b>, and open it from your home screen once while online.</p>`
    : installEvt ? `<button class="btn" data-install="go" style="margin-top:10px">Install the app</button>` : `<p class="note" style="margin-top:10px">Add this site to your home screen from the browser menu to use it offline.</p>`;
  return `<div class="card"><h3>Works offline</h3>
    <p>Saved on this phone, ready with no signal:</p>
    <ul class="offline-list"><li>The full line-up and timetable</li><li>${n ? `Your ${n} saved set${n === 1 ? "" : "s"}` : "Your saved sets"}</li><li>Now &amp; next</li><li>Artist photos</li></ul>
    <p class="note" style="margin-top:8px">${when ? `Last updated ${esc(when)}. ` : ""}It refreshes every time you open the app online.${state.persisted ? " Storage is kept on this device." : ""}</p>${how}
  </div>`;
}

// Install hint: iOS has no install prompt, so explain Share → Add to Home Screen. Others get the browser's own prompt.
var installEvt = null; // var: read by offlineCardHTML() before this line runs
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; showInstall(); });
addEventListener("appinstalled", () => { installEvt = null; hideInstall(true); });
const SHARE_ICO = `<svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>`;
function showInstall() {
  if (isStandalone() || store.get("installHint", 0) > Date.now()) return;
  const el = $("#install"); if (!el || !el.hidden) return;
  if (installEvt) el.innerHTML = `<img src="/icons/icon-192.png" alt=""><p><b>Install TML</b><br>Line-up and your sets, even with no signal.</p><button class="btn primary" data-install="go">Install</button><button class="x" data-install="no" aria-label="Not now">${ICON.close}</button>`;
  else if (isIOS()) el.innerHTML = `<img src="/icons/icon-192.png" alt=""><p><b>Use it offline at the festival</b><br>Tap ${SHARE_ICO} then <b>Add to Home Screen</b>.</p><button class="x" data-install="no" aria-label="Not now">${ICON.close}</button>`;
  else return;
  el.hidden = false;
}
function hideInstall(forever) {
  const el = $("#install"); if (el) el.hidden = true;
  store.set("installHint", Date.now() + (forever ? 3650 : 5) * 864e5);
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-install]"); if (!b) return;
  if (b.dataset.install === "no") return hideInstall(false);
  if (!installEvt) return;
  installEvt.prompt();
  try { const r = await installEvt.userChoice; if (r.outcome === "accepted") hideInstall(true); } catch {}
  installEvt = null;
});
if (isIOS() && !isStandalone()) setTimeout(showInstall, 4000);

setInterval(() => { if (state.view === "now" && festivalMoment()?.live) renderNow(); }, 60000);
</script>


<script>
// Magic background: pause when the tab is hidden, trim effects on low-power devices.
(() => {
  const r = document.documentElement;
  const lite = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.connection && navigator.connection.saveData);
  if (lite) r.classList.add("lite");
  const sync = () => r.classList.toggle("paused", document.visibilityState !== "visible");
  document.addEventListener("visibilitychange", sync); sync();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Hero stage above the line-up
  try {
    const n = new Set(RAW.split("\n").filter(l => l.includes(";")).map(l => l.split(";")[0].trim())).size;
    const h = document.createElement("section"); h.className = "hero3d"; h.setAttribute("aria-label", "Welcome");
    h.innerHTML = `<div class="ht"><span class="kick">Unofficial line-up · Thailand 2026</span><b>Feel every<br><em>emotion!</em></b><svg class="arrow" viewBox="0 0 92 60" aria-hidden="true"><path d="M4 52C22 50 46 40 58 22c4-6 6-12 7-18M56 10l9-7 5 11"/></svg><span class="sub"><i>${n}</i> artists · <i>${STAGES.length}</i> stages · <i>${DAYS.length}</i> days</span></div>`;
    const v = document.getElementById("v-lineup"); v.parentNode.insertBefore(h, v);
  } catch (e) {}
  // 3D sky (WebGL2), loaded once the page is idle
  const gl2 = (() => { try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; } })();
  if (!reduced && gl2) addEventListener("load", () => (window.requestIdleCallback || setTimeout)(() => import("./sky3d.js").catch(() => {}), { timeout: 1500 }));
  // Coverflow: tilt headliner posters by their distance from the rail centre
  let q = 0;
  const flow = () => { q = 0; document.querySelectorAll(".rail").forEach(rail => {
    const rb = rail.getBoundingClientRect(), mid = rb.left + rb.width / 2;
    rail.querySelectorAll(".poster").forEach(p => { const b = p.getBoundingClientRect();
      const d = Math.max(-1.4, Math.min(1.4, (b.left + b.width / 2 - mid) / rb.width));
      p.style.setProperty("--ry", (-d * 38).toFixed(2) + "deg"); p.style.setProperty("--sc", (1 - Math.min(Math.abs(d), 1) * .1).toFixed(3));
      p.style.setProperty("--gl", Math.min(Math.abs(d) * 1.6, 1).toFixed(2)); }); }); };
  const ask = () => { if (!q) q = requestAnimationFrame(flow); };
  document.addEventListener("scroll", e => { if (e.target.classList && e.target.classList.contains("rail")) ask(); }, true);
  addEventListener("resize", ask);
  // Reveal: cards below the fold flip in once; cards already on screen show at once
  const io = "IntersectionObserver" in window && !reduced ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" }) : null;
  if (io) r.classList.add("reveal");
  const SEL = ".now-card, .acard, .tl-item";
  const scan = () => { if (io) document.querySelectorAll(SEL).forEach(el => { if (el.classList.contains("in") || el.dataset.rv) return; el.dataset.rv = 1;
    if (el.getBoundingClientRect().top < innerHeight) el.classList.add("in"); else io.observe(el); }); ask(); };
  new MutationObserver(scan).observe(document.querySelector("main"), { childList: true, subtree: true });
  scan();
})();
</script>
<script>
// Timetable: the page scrolls up and down, the grid only scrolls sideways. Keep the stage names pinned under the header
// by sliding the header row down as the grid passes under it (one CSS variable write per frame, only on the timetable).
(() => {
  let queued = false;
  const pin = () => {
    queued = false;
    const g = document.getElementById("gridScroll"); if (!g || !g.offsetParent) return;
    const hdr = document.querySelector("header.top"), top = hdr ? hdr.getBoundingClientRect().bottom : 0;
    const r = g.getBoundingClientRect(), head = g.querySelector(".g-head"), hh = head ? head.offsetHeight : 46;
    const y = Math.max(0, Math.min(top - r.top, r.height - hh - 60));
    g.style.setProperty("--hy", y + "px");
  };
  const q = () => { if (!queued) { queued = true; requestAnimationFrame(pin); } };
  addEventListener("scroll", q, { passive: true }); addEventListener("resize", q);
  new MutationObserver(q).observe(document.body, { childList: true, subtree: true });
})();
</script>
